# Gerado por site/scripts/deploy.sh (repo marca-pessoal). Não editar aqui:
# o conteúdo deste repo é o build do site e é trocado a cada publicação.
#
# As versões das actions são as majors atuais (nov/2026). Não voltar para
# upload-pages-artifact@v3 + deploy-pages@v4: o deploy-pages passou a não
# enxergar o artefato subido pela v3 ("No artifacts named github-pages were
# found") e a publicação falha depois do push, com o conteúdo já no repo.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # actions: read é o que deixa o deploy-pages listar o artefato do próprio run
  # pela API de Actions. Sem ele, o passo sobe o artefato, o deploy falha com
  # "No artifacts named github-pages were found" e o site segue no build
  # anterior (nov/2026).
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
